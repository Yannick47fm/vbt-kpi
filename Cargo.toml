[package]
name = "vbt-kpi"
version = "0.1.0"
edition = "2021"
description = "PWA для подсчёта ежедневных KPI-баллов сотрудников DSA (egui + eframe, WASM)"
license = "MIT"

[dependencies]
# eframe 0.29: web-поддержка включается автоматически по target_arch (feature-флаги не нужны)
eframe = "0.29"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = "0.4"

# Версии выбираются cargo автоматически (Cargo.lock фиксирует фактическую).
# После первой сборки проверьте Cargo.lock: версия wasm-bindgen там должна
# совпадать с [tools].wasm_bindgen в Trunk.toml.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Clipboard", "Storage", "Window", "Navigator", "Document", "Element", "HtmlCanvasElement", "HtmlElement"] }
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 2
