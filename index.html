<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>KPI DSA — учёт баллов</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Подсчёт ежедневных KPI-баллов сотрудников DSA" />

    <!-- PWA: добавление на главный экран (iOS Safari) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KPI DSA" />
    <meta name="theme-color" content="#0b0f17" />

    <!-- Rust/WASM-сборка (Trunk): базовый URL из public-url -->
    <base data-trunk-public-url />
    <link data-trunk rel="rust" />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- Копирование статики в dist при сборке Trunk -->
    <link data-trunk rel="copy-file" href="manifest.webmanifest" />
    <link data-trunk rel="copy-file" href="sw.js" />
    <link data-trunk rel="copy-file" href="icon-192.png" />
    <link data-trunk rel="copy-file" href="icon-512.png" />
    <link data-trunk rel="copy-file" href="apple-touch-icon.png" />

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #0b0f17;
            overscroll-behavior: none;
        }
        body {
            padding: env(safe-area-inset-top) env(safe-area-inset-right)
                     env(safe-area-inset-bottom) env(safe-area-inset-left);
            box-sizing: border-box;
        }
        #the_canvas_id {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body>
    <!-- Холст, в который egui рисует интерфейс -->
    <canvas id="the_canvas_id" tabindex="0"></canvas>

    <!-- Регистрация service worker для оффлайн-режима -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('./sw.js').catch(function () {});
            });
        }
    </script>
</body>
</html>
